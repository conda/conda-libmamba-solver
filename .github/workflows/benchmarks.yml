name: Track Benchmarks

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  track-benchmarks:
    if: >-
      !github.event.repository.fork
      && contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
      && (
        github.event.workflow_run.event == 'pull_request'
        || (
          contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event.workflow_run.event)
          && (
            github.event.workflow_run.head_branch == 'main'
            || startsWith(github.event.workflow_run.head_branch, 'feature/')
            || endsWith(github.event.workflow_run.head_branch, '.x')
          )
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      pull-requests: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      BENCHMARK_RESULTS: benchmark-results/benchmark_results.json
      BASELINE_RESULTS: benchmark-results/baseline_results.json

    steps:
      - name: Locate benchmark artifacts
        id: artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            })
            const names = new Set(artifacts.filter(artifact => !artifact.expired).map(artifact => artifact.name))
            core.setOutput("found", (
              names.has("benchmark-results")
              && (context.payload.workflow_run.event !== "pull_request" || names.has("benchmark-event"))
            ))

      - name: Download benchmark results
        if: steps.artifacts.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: benchmark-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download PR event
        if: steps.artifacts.outputs.found == 'true' && github.event.workflow_run.event == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-event
          path: ${{ runner.temp }}/benchmark-event
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Export PR event data
        id: pr
        if: steps.artifacts.outputs.found == 'true' && github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_EVENT: ${{ runner.temp }}/benchmark-event/event.json
        with:
          script: |
            const fs = require("fs")
            const prEvent = JSON.parse(fs.readFileSync(process.env.PR_EVENT, { encoding: "utf8" }))
            const run = context.payload.workflow_run
            if (!Number.isSafeInteger(prEvent.number) || prEvent.number < 1) {
              throw new Error("Invalid pull request number in benchmark artifact")
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prEvent.number,
            })
            if (pr.head.sha !== run.head_sha || pr.head.repo?.full_name !== run.head_repository?.full_name) {
              core.notice("Skipping benchmarks for an outdated pull request head")
              return
            }
            if (prEvent.pull_request.head.sha !== pr.head.sha
                || !/^[a-f0-9]{40}$/.test(prEvent.pull_request.base.sha)
                || prEvent.pull_request.base.ref !== pr.base.ref) {
              throw new Error("Benchmark artifact does not match the pull request")
            }
            core.setOutput("current", true)
            core.exportVariable("BRANCH", `pr-${pr.number}`)
            core.exportVariable("COMMIT_SHA", pr.head.sha)
            core.exportVariable("PR_BASE_SHA", prEvent.pull_request.base.sha)
            core.exportVariable("PR_NUMBER", pr.number)
            core.exportVariable("BASELINE_BRANCH", `pr-${pr.number}-base-${run.id}-${run.run_attempt}`)

      - name: Select testbed and matching benchmarks
        id: results
        if: steps.artifacts.outputs.found == 'true' && (github.event.workflow_run.event != 'pull_request' || steps.pr.outputs.current == 'true')
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def unavailable(reason):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
                  print("comparison=false", file=outputs)
                  print(f"reason={reason}", file=outputs)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  print(reason, file=summary)
                  print("No performance comparison was made. Head measurements remain available in the producing workflow's benchmark-results artifact.", file=summary)

          results = json.loads(Path(os.environ["BENCHMARK_RESULTS"]).read_text())
          if results["commit_info"]["id"] != os.environ["COMMIT_SHA"]:
              raise ValueError("Head benchmark revision does not match the producing workflow")
          metadata_path = Path("benchmark-results/runner_metadata.json")
          if not metadata_path.exists() and os.environ.get("PR_NUMBER"):
              unavailable("This producer did not record the runner image and benchmark harness revision.")
              raise SystemExit(0)
          metadata = json.loads(metadata_path.read_text())
          if metadata["runner"] != "ubuntu-24.04":
              raise ValueError("Unexpected benchmark runner image")
          if metadata["harness_sha"] != os.environ["COMMIT_SHA"]:
              raise ValueError("Benchmark harness revision does not match the pull request head")
          machine = results["machine_info"]
          python = ".".join(machine["python_version"].split(".")[:2])
          # The reporting job has its own runner. Use the benchmark runner's
          # metadata to keep CPU models and Python minor versions separate.
          name = (
              f"{metadata['runner']}-{machine['machine']}-py{python}-"
              f"{machine['cpu']['brand_raw']}"
          )
          name = re.sub(r"[^\w.-]+", "-", name, flags=re.ASCII)
          if len(name) > 64:
              digest = hashlib.sha256(name.encode()).hexdigest()[:12]
              name = f"{name[:51]}-{digest}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"BENCHER_TESTBED={name}", file=env_file)

          if os.environ.get("PR_NUMBER"):
              baseline_path = Path(os.environ["BASELINE_RESULTS"])
              baseline = json.loads(baseline_path.read_text()) if baseline_path.exists() else None
              if baseline and baseline["commit_info"]["id"] != os.environ["PR_BASE_SHA"]:
                  raise ValueError("Base benchmark revision does not match the pull request event")
              common = (
                  {item["fullname"] for item in results["benchmarks"]}
                  & {item["fullname"] for item in baseline["benchmarks"]}
                  if baseline else set()
              )
              if common:
                  base_machine = baseline["machine_info"]
                  for key in ("system", "machine", "python_version"):
                      if base_machine[key] != machine[key]:
                          raise ValueError(f"Base and head benchmark runners differ: {key}")
                  if base_machine["cpu"]["brand_raw"] != machine["cpu"]["brand_raw"]:
                      raise ValueError("Base and head CPU models differ")
                  unmatched = len(results["benchmarks"]) - len(common)
                  for label, data in (("baseline", baseline), ("head", results)):
                      data["benchmarks"] = [item for item in data["benchmarks"] if item["fullname"] in common]
                      Path(f"benchmark-results/{label}_comparison.json").write_text(json.dumps(data))
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
                      print("comparison=true", file=outputs)
                      print(f"comparison_count={len(common)}", file=outputs)
                      print(f"unmatched_count={unmatched}", file=outputs)
              else:
                  unavailable("The base run has no benchmark results or no matching benchmark names.")

      - name: Report unavailable PR comparison
        if: steps.pr.outputs.current == 'true' && steps.results.outputs.comparison == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPARISON_REASON: ${{ steps.results.outputs.reason }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: "Benchmark comparison",
              head_sha: process.env.COMMIT_SHA,
              status: "completed",
              conclusion: "neutral",
              details_url: context.payload.workflow_run.html_url,
              output: {
                title: "PR comparison is unavailable",
                summary: `${process.env.COMPARISON_REASON} No performance comparison was made. Head measurements are available in the producing workflow's benchmark-results artifact.`,
              },
            })

      - name: Install Bencher CLI
        if: steps.artifacts.outputs.found == 'true' && (github.event.workflow_run.event != 'pull_request' || steps.results.outputs.comparison == 'true')
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
        with:
          version: '0.6.12'

      - name: Track benchmarks with Bencher
        if: steps.artifacts.outputs.found == 'true' && (github.event.workflow_run.event != 'pull_request' || steps.results.outputs.comparison == 'true')
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            # A separate branch holds only this runner's base measurements.
            # Never reset or add PR baseline measurements to the main history.
            bencher run \
              --project conda-libmamba-solver \
              --key "$BENCHER_API_KEY" \
              --branch "$BASELINE_BRANCH" \
              --hash "$PR_BASE_SHA" \
              --testbed "$BENCHER_TESTBED" \
              --adapter python_pytest \
              --file benchmark-results/baseline_comparison.json
            BENCHMARK_RESULTS=benchmark-results/head_comparison.json
            options=(
              --start-point "$BASELINE_BRANCH"
              --start-point-hash "$PR_BASE_SHA"
              --start-point-reset
              --threshold-measure latency
              --threshold-test percentage
              --threshold-min-sample-size 1
              --threshold-max-sample-size 1
              --threshold-upper-boundary 0.25
              --thresholds-reset
              --ci-only-on-alert
              --ci-number "$PR_NUMBER"
            )
          else
            options=(
              --threshold-measure latency
              --threshold-test t_test
              --threshold-min-sample-size 10
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
            )
          fi
          bencher run \
            --project conda-libmamba-solver \
            --key "$BENCHER_API_KEY" \
            --branch "$BRANCH" \
            --hash "$COMMIT_SHA" \
            --testbed "$BENCHER_TESTBED" \
            --err \
            --adapter python_pytest \
            --github-actions "$GH_TOKEN" \
            "${options[@]}" \
            --file "$BENCHMARK_RESULTS"

      - name: Explain paired comparison
        if: ${{ !cancelled() && steps.results.outputs.comparison == 'true' }}
        env:
          COMMON_BENCHMARKS: ${{ steps.results.outputs.comparison_count }}
          UNMATCHED_BENCHMARKS: ${{ steps.results.outputs.unmatched_count }}
        run: |
          {
            echo "Measured $COMMON_BENCHMARKS matching benchmarks at the base and PR revisions on the same runner."
            echo "Head benchmarks without matching base measurements: $UNMATCHED_BENCHMARKS."
            echo "The initial alert tolerance is a 25% latency increase. Runner load and cache state can still vary."
          } >> "$GITHUB_STEP_SUMMARY"
